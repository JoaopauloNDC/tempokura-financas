<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças · O Tempo Kura</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>
const CHAVE = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const URL_DADOS = "https://script.google.com/macros/s/AKfycbzya2TbnCDllXp-wSp1WMULsPHJEgEd8lljcBXVpj9n7wP5Ek-UoL7nkhsFzlWypoYGeQ/exec?formato=json&k=" + encodeURIComponent(CHAVE);
let DADOS = null;
try { const x = new XMLHttpRequest(); x.open("GET", URL_DADOS, false); x.send(); DADOS = JSON.parse(x.responseText); } catch (e) { DADOS = { erro: "Sem conexão com a planilha" }; }
if (DADOS.erro) { document.documentElement.innerHTML = "<body style='background:#111;color:#eee;font-family:sans-serif;padding:24px'>" + DADOS.erro + ".</body>"; throw new Error(DADOS.erro); }
</script>
<style>
:root {
  --grafite: #17191B; --panel: #1E2124; --panel2: #24282B; --concreto: #D4D2CC; --aco: #A9B0B6; --petroleo: #1F3A40; --bronze: #9A7B52; --lume: #BFD8B4;
  --line: rgba(139,146,152,.22); --alarme: #E0816F; --alarme-bg: rgba(224,129,111,.10);
  --display: "Atkinson Hyperlegible", "Segoe UI", sans-serif; --body: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--grafite); color: var(--concreto); font: 16px/1.55 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 110px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; }
.marca { font: 700 12px var(--display); letter-spacing: .3em; text-transform: uppercase; color: var(--bronze); }
h1 { font: 700 clamp(1.8rem, 4vw, 2.6rem)/1.05 var(--display); letter-spacing: -.02em; margin: 4px 0; }
.sub { color: var(--aco); font-size: 13.5px; margin: 0; }
.sub b { color: var(--lume); font-weight: 400; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pills button { font: 700 13px var(--body); color: var(--concreto); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--petroleo); border-color: var(--lume); color: #fff; }
button:focus-visible { outline: 2px solid var(--lume); outline-offset: 2px; }

.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card, .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card .k { color: var(--aco); font-size: 13px; }
.card .v { font: 700 clamp(1.5rem, 2.6vw, 2rem)/1.15 var(--display); letter-spacing: -.02em; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
.card .v.neg { color: var(--concreto); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--aco); }
.tag.lume { color: var(--lume); }

.main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
.col { display: grid; gap: 12px; align-content: start; min-width: 0; }
h2 { font: 700 15px var(--display); margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
h2 small { font: 400 12px var(--body); color: var(--aco); }

.proj { background: linear-gradient(135deg, var(--petroleo), var(--panel) 75%); }
.proj .v { font: 700 clamp(1.3rem, 2.2vw, 1.75rem)/1.15 var(--display); letter-spacing: -.02em; color: var(--lume); }
.proj .v small { font: 500 14px var(--display); color: var(--concreto); margin-left: 6px; }
.track { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.06); margin: 14px 0 6px; }
.track i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.track .feito { left: 0; background: var(--concreto); }
.track .faixa { background: repeating-linear-gradient(135deg, rgba(191,216,180,.75) 0 4px, transparent 4px 8px); border: 1px solid rgba(191,216,180,.6); }
.track .mark { width: 2px; top: -4px; bottom: -4px; background: var(--concreto); border-radius: 0; }
.legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--aco); gap: 8px; flex-wrap: wrap; }

svg text { font-family: var(--body); }
.chart svg { width: 100%; height: auto; display: block; }
.rank { display: grid; gap: 10px; }
.rank .row { display: grid; grid-template-columns: 9.5em 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; }
.rank .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.06); overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--aco); border-radius: 5px; }
.rank .row:first-child .bar i { background: var(--concreto); }
.rank .num { text-align: right; font-variant-numeric: tabular-nums; }

.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerts li { padding: 10px 12px; border-radius: 10px; background: var(--alarme-bg); border: 1px solid rgba(224,129,111,.35); display: grid; gap: 2px; }
.alerts li .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 700; }
.alerts li .tg { font-size: 12px; font-weight: 700; color: var(--alarme); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.alerts li .a { color: var(--aco); font-size: 13px; }
.alerts li.ok { background: rgba(191,216,180,.07); border-color: rgba(191,216,180,.3); }

table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--aco); font-weight: 400; font-size: 12.5px; border-top: 0; }
td.r, th.r { text-align: right; }
.scroll { overflow-x: auto; }
.pecas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.peca .id { font: 700 12px var(--display); color: var(--bronze); letter-spacing: .1em; }
.peca .nome { font: 700 1.35rem/1.15 var(--display); letter-spacing: -.02em; margin: 2px 0; }
.peca .det { color: var(--aco); font-size: 13px; }
.peca dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 12px 0 0; font-size: 14px; }
.peca dt { color: var(--aco); } .peca dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.peca dd.lume { color: var(--lume); font-weight: 700; }
.nota { color: var(--aco); font-size: 12.5px; margin: 8px 0 0; }

nav.bottom { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; background: rgba(30,33,36,.92); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(8px); max-width: calc(100% - 32px); }
nav.bottom button { font: 700 14px var(--body); color: var(--aco); background: transparent; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
nav.bottom button[aria-current="page"] { background: var(--concreto); color: var(--grafite); }
[hidden] { display: none !important; }
ul.lista { list-style: none; margin: 0; padding: 0; }
ul.lista li { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
ul.lista li:first-child { border-top: 0; padding-top: 0; }
ul.lista .q { font-size: 12.5px; color: var(--aco); }
ul.lista .q.atr { color: var(--alarme); }
::selection { background: var(--petroleo); color: #fff; }
.pista { color: var(--aco); font-size: 13.5px; margin: 0 0 4px; max-width: 70ch; }

/* Foco agora: o que precisa ser visto primeiro em cada página */
.foco h2 { margin-bottom: 10px; }
.foco ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.foco li { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 3px; align-content: start; }
.foco li .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 700; }
.foco li .tg { font-size: 12px; font-weight: 700; color: var(--aco); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.foco li .a { color: var(--aco); font-size: 13px; }
.foco li.urg { background: var(--alarme-bg); border-color: rgba(224,129,111,.35); }
.foco li.urg .tg, .foco li.urg .a { color: var(--alarme); }
.foco li.ok { background: rgba(191,216,180,.07); border-color: rgba(191,216,180,.3); }

/* Abre e fecha ao tocar */
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
summary:focus-visible { outline: 2px solid var(--lume); outline-offset: 3px; border-radius: 8px; }
.seta { display: inline-block; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform .2s cubic-bezier(.2,.8,.2,1); flex: none; }
details[open] > summary .seta { transform: rotate(-135deg) translate(-2px, 0); }
.mais > summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 15px var(--display); }
.mais > summary small { font: 400 12px var(--body); color: var(--aco); margin-left: 8px; }
.mais { align-self: start; }
.mais[open] > summary { margin-bottom: 12px; }
.peca .resumo { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.peca .resumo b { color: var(--lume); font-variant-numeric: tabular-nums; }
.peca .resumo .dica { color: var(--aco); font-size: 12.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.peca .foto { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: var(--panel2); margin-bottom: 12px; }
.peca a.fotos { color: var(--lume); font-size: 13px; text-underline-offset: 3px; display: inline-block; margin-top: 10px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.sw.linha { height: 0; border-top: 2px dashed var(--bronze); border-radius: 0; vertical-align: 3px; width: 14px; }
.sw.listra { background: repeating-linear-gradient(135deg, rgba(191,216,180,.75) 0 2px, transparent 2px 4px); border: 1px solid rgba(191,216,180,.6); }
.chart rect.alvo { cursor: pointer; }
.chart rect.alvo:hover { fill: rgba(255,255,255,.04); }

/* Meta com mais de um cenário */
.cen { display: grid; gap: 6px; margin-top: 10px; }
.cen div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13.5px; padding-top: 6px; border-top: 1px solid var(--line); }
.cen span { color: var(--aco); font-size: 12.5px; }
.cen .r { text-align: right; }

/* Linha do tempo das fases */
.fases { display: grid; gap: 6px; --n: 6; }
.fases .eixo, .fases .fase { display: grid; grid-template-columns: minmax(11em, 16em) repeat(var(--n), minmax(0, 1fr)); gap: 0 4px; align-items: center; }
.fases .eixo span { font-size: 12px; color: var(--aco); text-align: center; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.fases .eixo span.lb { border-bottom: 0; }
.fases .fase .lb { font-size: 14px; padding-right: 12px; }
.fases .fase .bar { height: 24px; border-radius: 6px; background: rgba(191,216,180,.14); border: 1px solid rgba(191,216,180,.45); color: var(--lume); font-size: 12px; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; }
@media (max-width: 640px) {
  /* a 1ª coluna (nome) fica com largura zero: o nome vai para a linha de cima e as barras seguem na mesma coluna do mês */
  .fases .eixo, .fases .fase { grid-template-columns: 0 repeat(var(--n), minmax(0, 1fr)); gap: 0 3px; }
  .fases .eixo span { font-size: 12px; }
  .fases .fase .lb { grid-column: 1 / -1; padding: 8px 0 4px; }
  .fases .fase .bar { grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { .seta { transition: none; } }

@media (max-width: 480px) { .card .v { font-size: 1.3rem; } nav.bottom button { padding: 8px 14px; } }

/* Mini-linha dos cartões (aparece com 2 meses ou mais de dado) */
.spark { display: block; width: 100%; height: 28px; margin: 0 0 8px; overflow: visible; }

/* Chips de alerta */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { font-size: 13px; font-weight: 700; line-height: 1.35; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(224,129,111,.45); background: var(--alarme-bg); color: var(--alarme); }

/* Leitura do dono */
.leitura { margin-bottom: 12px; }
.leitura ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.leitura li { font-size: 15px; }
.leitura li::marker { color: var(--bronze); font-weight: 700; }

/* Régua dos R$ 100 */
.regua .pills { margin-bottom: 12px; }
.regua .pills button { padding: 6px 12px; }
.regua .barra { display: flex; height: 30px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.06); }
.regua .barra i { display: block; height: 100%; min-width: 2px; }
.regua dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 12px 0 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.regua dt { color: var(--aco); } .regua dd { margin: 0; text-align: right; }
.regua dd b { color: var(--concreto); }
.regua dd.lume b { color: var(--lume); } .regua dd.neg b { color: var(--alarme); }

/* Gráfico: botões e valor ao tocar */
.chart .topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.chart .topo h2 { margin: 0; flex-wrap: wrap; justify-content: flex-start; }
@media (max-width: 480px) { .rank .row { grid-template-columns: minmax(0, 8em) 1fr auto; } }
.chart .pills button { padding: 6px 12px; }

.tip { margin-top: 8px; background: var(--panel2); border: 1px solid var(--lume); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.4; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip b { color: var(--lume); }

/* v15: ajuda, botões, formulários e aviso de gravação */
.ajuda { position: relative; display: inline-block; font: 400 13px/1.45 var(--body); margin-left: auto; }
.ajuda > summary { position: relative; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--aco); font: 700 14px var(--body); }
.ajuda > summary::after { content: ""; position: absolute; inset: -8px; } /* área de toque de 46 px */
.ajuda[open] > summary { border-color: var(--lume); color: var(--lume); }
.ajuda > p { position: absolute; right: 0; top: 38px; z-index: 5; width: min(320px, calc(100vw - 48px)); margin: 0; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--lume); border-radius: 10px; color: var(--concreto); text-align: left; letter-spacing: 0; text-transform: none; font-weight: 400; white-space: normal; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.btn { font: 700 14px var(--body); color: var(--concreto); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer; }
.btn:hover { border-color: var(--aco); }
.btn.pri { background: var(--petroleo); border-color: var(--lume); color: #fff; }
.btn.perigo { color: var(--alarme); border-color: rgba(224,129,111,.45); }
.btn[aria-pressed="true"] { background: var(--concreto); color: var(--grafite); border-color: var(--concreto); }
.btn:disabled { opacity: .5; cursor: default; }
.acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
form.edita { display: grid; gap: 10px; margin-top: 10px; padding: 12px; border: 1px solid var(--lume); border-radius: 10px; background: var(--panel2); }
form.edita label { display: grid; gap: 4px; font-size: 13px; color: var(--aco); }
form.edita .duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
input, select, textarea { font: 16px var(--body); color: var(--concreto); background: var(--grafite); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--lume); outline-offset: 1px; }
.aviso { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.aviso.ok { border-color: var(--lume); } .aviso.erro { border-color: var(--alarme); color: var(--alarme); } .aviso.salvando { padding-right: 16px; min-height: 44px; }
.est { font-size: 12px; font-weight: 700; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; white-space: nowrap; color: var(--aco); }
.est.andamento { color: var(--lume); } .est.esperando { color: var(--bronze); } .est.atraso { color: var(--alarme); }
.pend { display: grid; gap: 4px; }
.pend .t { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.estados { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.estados .btn { padding: 0 10px; font-size: 13px; }
.peca .pd > summary { display: grid; gap: 2px; }
.foco li .acoes { margin-top: 6px; }
h2 .ajuda { align-self: center; }
/* alvo de toque de 44 px também nos botões que já existiam */
.pills button, nav.bottom button { min-height: 44px; }
.mais > summary { min-height: 44px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="marca">O Tempo Kura · Finanças</div>
      <h1 id="pergunta">Como está a Tempo Kura?</h1>
      <p class="pista" id="pista"></p>
      <p class="sub" id="sub"></p>
    </div>
    <div class="pills" id="periodo" aria-label="Período"></div>
  </header>

  <!-- INÍCIO -->
  <section id="p-inicio" data-pagina="inicio">
    <div class="box foco" id="focoInicio" style="margin-bottom:12px"></div>
    <div class="chips" id="chips" role="list" aria-label="Alertas"></div>
    <div class="box leitura" id="leitura"></div>
    <div class="cards" id="cards"></div>
    <div class="main" style="margin-top:12px">
      <div class="col">
        <div class="box chart"><div class="topo"><h2>Gastos × vendas <small id="grafSub"></small></h2><div class="pills" id="modoGraf" aria-label="Como somar"></div></div><div class="plot" id="grafico"></div></div>
        <div class="box"><h2>Para onde foi o dinheiro <small>maior → menor</small></h2><div class="rank" id="rank"></div></div>
      </div>
      <div class="col">
        <div class="box regua" id="regua"></div>
        <div class="box proj" id="projBox"></div>
      </div>
    </div>
    <details class="box mais" id="metodoBox" style="margin-top:12px"><summary><span>Como as contas são feitas</span><span class="seta"></span></summary><ul class="lista" id="metodo"></ul></details>
  </section>

  <!-- PEÇAS -->
  <section id="p-pecas" data-pagina="pecas" hidden>
    <div class="pecas" id="pecas"></div>
    <div class="main" style="margin-top:12px">
      <div class="box" id="margensBox"></div>
      <div class="box" id="novoLancBox"></div>
    </div>
    <details class="box mais" id="lancBox" style="margin-top:12px"><summary><span>Lançamentos <small id="nL"></small></span><span class="seta"></span></summary><div class="scroll"><table id="lanc"></table></div></details>
  </section>

  <!-- PLANO -->
  <section id="p-plano" data-pagina="plano" hidden>
    <div class="box foco" id="focoPlano" style="margin-bottom:12px"></div>
    <div class="box" id="pendBox" style="margin-bottom:12px"><h2>Pendências, por prioridade <small id="nE"></small></h2><div id="pendTopo"></div><ul class="lista" id="entregas"></ul></div>
    <div class="pecas" id="metas"></div>
    <div class="box" id="inicioBox" style="margin-top:12px"></div>
    <div class="box" id="fasesBox" style="margin-top:12px"><h2>Depois da 1ª postagem de produto <small id="fasesSub">mês a mês</small></h2><div class="fases" id="fases"></div></div>
    <div class="main" style="margin-top:12px">
      <details class="box mais" id="feitasBox"><summary><span>Feitas <small id="nF"></small></span><span class="seta"></span></summary><ul class="lista" id="feitas"></ul></details>
      <details class="box mais" id="ideiasBox"><summary><span>Ideias para trabalhar <small id="nI"></small></span><span class="seta"></span></summary><ul class="lista" id="ideias"></ul></details>
    </div>
  </section>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
<nav class="bottom" aria-label="Páginas">
  <button type="button" data-ir="inicio" aria-current="page">Início</button>
  <button type="button" data-ir="pecas">Peças</button>
  <button type="button" data-ir="plano">Plano</button>
</nav>

<script>
(() => {
  const MARGEM_MINIMA = 40; // % mínima de margem por peça quando a aba Plano não tem meta "Margem ..."; escolha do Bruce em 12/11 (autorizada pelo João Paulo), mude aqui
  const DIAS_PARADO = 60; // peça sem vender há mais dias que isto vira alerta; mude aqui
  // Ideia futura: receita projetada (conservador/otimista) quando houver o prazo médio de venda das peças.
  const $ = (id) => document.getElementById(id);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const brl = (v, cents) => (v < 0 ? "−" : "") + "R$ " + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  const mesKey = (d) => d.slice(0, 7);
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const mesNome = (k) => { const [y, m] = k.split("-"); return `${MESES[+m - 1]}/${y.slice(2)}`; };
  const hoje = new Date(), hojeKey = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}`;
  let L, P, meses;
  const soma = (arr) => arr.reduce((s, x) => s + x.valor, 0);
  const custoPeca = (id) => soma(L.filter((x) => x.tipo === "Gasto" && x.peca === id));
  const vendaPeca = (id) => soma(L.filter((x) => x.tipo === "Receita" && x.peca === id));
  const diasDe = (p) => p.compra ? Math.floor((hoje - new Date(p.compra + "T12:00")) / 86400000) : null;
  const ehCompra = (x) => /aquisi|frete de entrada/i.test(x.categoria); // o resto dos gastos da peça = custos extras
  const ehMetaMargem = (m) => /^margem/i.test(m.titulo); // meta "Margem ..." na aba Plano, Alvo em %
  // margem mínima da peça: a do tipo dela (aba Plano, linha Margem); senão a meta "Margem ..."; senão o padrão provisório
  function margemDe(p) {
    const t = DADOS.plano.margens && DADOS.plano.margens[p.tipo]; if (t > 0) return { v: t, fonte: "tipo " + p.tipo };
    const mm = DADOS.plano.metas.find(ehMetaMargem); if (mm && mm.alvo > 0) return { v: mm.alvo <= 1 ? mm.alvo * 100 : mm.alvo, fonte: "meta" }; // aceita 0,4 ou 40
    return { v: MARGEM_MINIMA, fonte: "padrão provisório" };
  }
  const abertas = () => DADOS.plano.entregas.filter((e) => e.estado !== "feito");
  const ESTADOS_PECA = [["a caminho", "A caminho"], ["no relojoeiro", "No relojoeiro"], ["pronta", "Pronta"], ["à venda", "À venda"], ["vendida", "Vendida"]];
  const TIPOS = [["própria", "Própria"], ["clube", "Com investidor do clube"], ["consignada", "Consignada"]];
  // dias parada: conta desde que ficou pronta/à venda (ou desde a compra, se não houver data)
  const parada = (p) => (p.estado === "pronta" || p.estado === "à venda") ? (p.desde ? -diasAte(p.desde) : diasDe(p)) : null;
  // Conta de uma peça: compra, extras e o preço usado (venda real > preço definido > venda mínima da faixa)
  function conta(p) {
    const g = L.filter((x) => x.tipo === "Gasto" && x.peca === p.id), compra = soma(g.filter(ehCompra)), custo = soma(g), vend = vendaPeca(p.id);
    const real = vend > 0 || (p.status === "Vendida" && p.venda > 0);
    const preco = vend || p.venda || (p.faixa ? p.faixa[0] : 0);
    const base = real ? "real" : p.venda ? "preço definido" : p.faixa && p.faixa[0] > 0 ? "estimativa" : null;
    const porCat = {}; for (const x of g.filter((x) => !ehCompra(x))) porCat[x.categoria] = (porCat[x.categoria] || 0) + x.valor;
    const maior = Object.entries(porCat).sort((a, b) => b[1] - a[1])[0] || null;
    return { compra, extras: custo - compra, custo, preco, base, lucro: preco - custo, margem: preco > 0 ? (preco - custo) / preco * 100 : null, maior };
  }
  const rotulo = (c) => c.base === "real" ? "" : c.base === "estimativa" ? " (estimativa, na venda mínima da faixa)" : " (no preço definido, ainda não vendida)";
  // o que está aberto continua aberto quando os dados chegam de novo (a cada 30 s)
  const aberto = new Set();
  const dobra = (det, id) => { det.open = aberto.has(id); det.ontoggle = () => { if (det.open) aberto.add(id); else aberto.delete(id); }; };
  const sw = (cls, txt) => { const s = el("span"); s.append(el("i", "sw " + cls), document.createTextNode(txt)); return s; };
  function foco(boxId, nome, itens, vazio) {
    const box = $(boxId); box.textContent = ""; box.append(titulo(nome, null, AJUDA.foco));
    const ol = el("ol");
    if (!itens.length) { const li = el("li", "ok"); li.append(el("span", "t", vazio)); ol.append(li); }
    for (const it of itens) {
      const li = el("li", it.urg ? "urg" : null), t = el("span", "t"); t.append(el("span", null, it.t)); if (it.tag) t.append(el("span", "tg", it.tag)); li.append(t); if (it.a) li.append(el("span", "a", it.a));
      const e = it.id && DADOS.plano.entregas.find((x) => x.id === it.id);
      if (e) { const a = el("div", "acoes"); a.append(btn("Feito ✓", null, () => marcarFeito(e), "Marcar como feita: " + e.texto)); li.append(a); }
      ol.append(li);
    }
    box.append(ol);
  }
  // Link das fotos (coluna G da aba Peças): só mostra quando estiver preenchido
  const linkOk = (u) => /^https:\/\//i.test(u || "");
  function fotoSrc(u) {
    if (!linkOk(u)) return null;
    const id = (u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/) || [])[1];
    if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
    return /\.(jpe?g|png|webp)(\?|$)/i.test(u) ? u : null;
  }

  // ===== v15: ajuda, gravação, formulários =====
  const btn = (txt, cls, fn, rotuloAria) => { const b = el("button", "btn " + (cls || ""), txt); b.type = "button"; if (fn) b.onclick = fn; if (rotuloAria) b.setAttribute("aria-label", rotuloAria); return b; };
  // "?" que abre e fecha com toque (funciona no celular); o texto fica numa caixinha embaixo
  const ajuda = (txt) => { const d = el("details", "ajuda"), s = el("summary", null, "?"); s.setAttribute("aria-label", "Ajuda"); d.append(s, el("p", null, txt)); return d; };
  const titulo = (txt, small, help) => { const h = el("h2", null, txt); if (small) h.append(el("small", null, " " + small)); if (help) h.append(ajuda(help)); return h; };
  const AJUDA = {
    foco: "O que pede atenção agora: prazos perto ou atrasados, peças a caminho ou no relojoeiro e avisos. Toque em Feito quando terminar.",
    chips: "Alertas automáticos: prazo em até 3 dias, peça pronta ou à venda parada há muito tempo, custo acima da venda mínima e margem abaixo da mínima.",
    leitura: "Três frases tiradas dos números, para ler o negócio em 10 segundos. Some sozinha se faltar dado.",
    grafico: "Barras: quanto saiu (gastos) e entrou (vendas) em cada mês. Linha tracejada: o resultado somado desde o começo. Toque num mês para ver só ele.",
    rank: "Em que categorias o dinheiro foi gasto, da maior para a menor, no período escolhido.",
    regua: "De cada R$ 100 que entrarem numa venda: quanto paga a compra e o frete, quanto paga restauro e extras e quanto sobra de lucro. Até o orçamento do relojoeiro chegar, é estimativa na venda mínima da faixa.",
    proj: "Quanto de lucro o estoque daria se cada peça vendesse entre a venda mínima e a máxima que você definiu. Ajuste a faixa no cartão da peça.",
    pecas: "Um cartão por relógio. Toque no estado (a caminho, no relojoeiro...) para mudar com um toque. Em Ajustar, mude a faixa de preço, a previsão e o tipo da peça.",
    margens: "A margem mínima que cada tipo de peça precisa ter (lucro ÷ preço de venda). Campo vazio usa o padrão provisório de 40%. Abaixo disso, aparece alerta.",
    lanc: "Registra um gasto ou uma venda direto na aba Lançamentos, numa linha nova. Não muda nem apaga lançamentos antigos. Errou? Corrija na planilha.",
    pend: "Tudo o que falta fazer, na ordem de prioridade (▲ ▼ mudam a ordem). Estado: a fazer, andamento, esperando (sem alarme) ou feito. Em Editar você muda texto, prazo, divide em duas ou apaga.",
    metas: "Quanto falta para cada meta e o ritmo por mês para chegar no prazo. Toque em Ajustar para mudar o número atual, o alvo ou o prazo.",
    inicio: "A data em que as vendas e o Instagram começam. Ela define os meses da linha do tempo abaixo e aparece no Foco quando chegar perto.",
    fases: "O que fazer em cada mês depois da 1ª postagem de produto. Com a data de início das vendas, cada mês ganha o nome do mês de verdade.",
    feitas: "Pendências marcadas como feitas, com a data. Toque em Reabrir se precisar voltar com alguma.",
    lancList: "Todas as linhas da aba Lançamentos, da mais nova para a mais antiga."
  };
  let ocupado = false, desfazerUlt = null, adiado = false, versao = 0;
  const enviar = (corpo) => fetch("https://script.google.com/macros/s/AKfycbzya2TbnCDllXp-wSp1WMULsPHJEgEd8lljcBXVpj9n7wP5Ek-UoL7nkhsFzlWypoYGeQ/exec", { method: "POST", credentials: "omit", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({}, corpo, { k: CHAVE })) })
    .then((r) => { if (!r.ok) throw new Error("sem conexão (" + r.status + ")"); return r.json(); });
  function aviso(txt, tipo, botao) {
    const a = $("aviso"); a.textContent = ""; a.className = "aviso " + (tipo || ""); a.append(el("span", null, txt));
    if (botao) a.append(btn(botao.txt, null, botao.fn));
    if (tipo === "erro") a.append(btn("Fechar", null, () => { a.hidden = true; }));
    a.hidden = false; clearTimeout(a._t);
    // o Desfazer só vale enquanto o aviso aparece (9 s): depois, outra pessoa pode ter mudado o mesmo item
    if (tipo === "ok") a._t = setTimeout(() => { a.hidden = true; desfazerUlt = null; }, botao ? 9000 : 2500);
  }
  // grava uma ou mais ações em sequência; "inversos" desfaz (recebe as respostas, para saber Ids novos)
  async function gravar(corpos, inversos) {
    if (ocupado) { aviso("Espere terminar de salvar…", "erro"); return null; }
    ocupado = true; aviso("Salvando…", "salvando");
    const resp = [], lista = [].concat(corpos);
    try {
      for (const c of lista) { const r = await enviar(c); if (!r || r.erro) throw new Error((r && r.erro) || "sem resposta"); resp.push(r); }
      const inv = typeof inversos === "function" ? inversos(resp) : inversos;
      desfazerUlt = inv ? [].concat(inv) : null;
      aviso("Salvo", "ok", desfazerUlt && { txt: "Desfazer", fn: desfazer });
      return resp;
    } catch (e) {
      const m = String((e && e.message) || e); // erro de rede vira frase simples
      if (resp.length) { // parte já foi gravada: não dizer "Não salvou"; o Desfazer vale para o que entrou
        const inv = typeof inversos === "function" ? [] : [].concat(inversos || []).slice(0, resp.length);
        desfazerUlt = inv.length ? inv : null;
        aviso(`Salvou só parte (${resp.length} de ${lista.length}): ${m}. Confira e tente o resto de novo.`, "erro", desfazerUlt && { txt: "Desfazer", fn: desfazer });
        return null;
      }
      aviso("Não salvou: " + (/fetch|network|load failed/i.test(m) ? "sem conexão com a planilha" : m) + ". O painel continua mostrando os dados; tente de novo.", "erro");
      return null;
    } finally {
      ocupado = false;
      if (resp.length) {
        versao++; // busca de 30 s que saiu antes deste salvar traz dados velhos: é descartada
        const d = resp[resp.length - 1].dados;
        if (d) { usar(d); adiado = false; render(); } else buscar(); // salvou mas a leitura falhou: busca de novo
      }
    }
  }
  async function desfazer() { const inv = desfazerUlt; desfazerUlt = null; if (inv) { const r = await gravar(inv, null); if (r) aviso("Desfeito", "ok"); } }
  // enquanto há um formulário aberto, a busca de 30 s guarda os dados e só redesenha quando fechar
  const emEdicao = () => [...document.querySelectorAll("form.edita")].some((f) => !f.closest("[hidden]"));
  function chegou(d) {
    // alguém mudou a planilha (ex.: o JC): o Desfazer antigo deixa de valer
    if (JSON.stringify(d.plano) !== JSON.stringify(DADOS.plano) || JSON.stringify(d.pecas) !== JSON.stringify(DADOS.pecas)) { desfazerUlt = null; const a = $("aviso"); if (a.classList.contains("ok")) a.hidden = true; }
    usar(d); if (emEdicao()) adiado = true; else render(); }
  function fecharForm(f) { f.remove(); if (adiado && !emEdicao()) { adiado = false; render(); } }
  const hojeISO = () => { const h = new Date(); return `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, "0")}-${String(h.getDate()).padStart(2, "0")}`; };
  const somaDias = (iso, n) => { const [y, m, d] = iso.split("-").map(Number), x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
  // campo de formulário: [rótulo, tipo, valor, extra]
  function campo(f, nome, rotuloTxt, tipo, valor, extra) {
    const l = el("label", null, rotuloTxt); let i;
    if (tipo === "select") { i = el("select"); for (const [v, t] of extra) { const o = el("option", null, t); o.value = v; i.append(o); } }
    else if (tipo === "textarea") i = el("textarea");
    else { i = el("input"); i.type = tipo; if (tipo === "number") { i.min = "0"; i.step = "any"; i.inputMode = "decimal"; } }
    i.name = nome; if (valor != null) i.value = valor; if (tipo === "text" || tipo === "textarea") i.maxLength = extra || 300;
    l.append(i); f.append(l); return i;
  }
  function form(onde, depois) { const f = el("form", "edita"); f.noValidate = true; if (depois) onde.after(f); else onde.append(f); return f; }
  // abre um formulário só por item; tocar de novo fecha
  function alternaForm(chave, monta) { const ja = document.querySelector(`form.edita[data-chave="${CSS.escape(chave)}"]`); if (ja) { fecharForm(ja); return; } const f = monta(); f.dataset.chave = chave; const i = f.querySelector("input,select,textarea"); if (i) i.focus(); }
  const numOuNulo = (v) => v.trim() === "" ? null : Number(v.replace(",", "."));

  function usar(d) {
    DADOS = d; L = d.lancamentos; P = d.pecas; meses = [];
    // meses do primeiro lançamento até hoje
    const ini = L.map((x) => mesKey(x.data)).sort()[0] || hojeKey; let [y, m] = ini.split("-").map(Number);
    while (`${y}-${String(m).padStart(2, "0")}` <= hojeKey) { meses.push(`${y}-${String(m).padStart(2, "0")}`); if (++m > 12) { m = 1; y++; } }
  }
  usar(DADOS);

  let periodo = "tudo";
  const PERGUNTAS = { inicio: "Como está a Tempo Kura?", pecas: "Quanto vale o estoque e quanto pode render?", plano: "O que vem pela frente?" };
  const PISTAS = {
    inicio: "Em cima, o que pede atenção e a leitura dos números. Toque num mês do gráfico para ver o valor exato e só aquele mês.",
    pecas: "Um cartão por relógio. Toque no estado (a caminho, no relojoeiro, pronta...) para mudar na hora; em Ajustar, mude a faixa de preço, a previsão e o tipo. Toque no cartão para ver cada gasto.",
    plano: "Em cima, o que tem data. Depois, as pendências (marque Feito, edite, mude a ordem), as metas e as fases depois da 1ª postagem. Tudo grava na aba Plano da planilha."
  };

  function pills() {
    const box = $("periodo"); box.textContent = "";
    const ult = meses.slice(-3).reverse(); if (periodo !== "tudo" && !ult.includes(periodo)) ult.push(periodo);
    for (const [k, nome] of [["tudo", "Desde o início"], ...ult.map((m) => [m, mesNome(m)])]) {
      const b = el("button", null, nome); b.type = "button"; b.setAttribute("aria-pressed", String(k === periodo));
      b.onclick = () => { periodo = k; render(); }; box.appendChild(b);
    }
  }
  const noPeriodo = (x) => periodo === "tudo" || mesKey(x.data) === periodo;
  const anterior = () => { const i = meses.indexOf(periodo); return i > 0 ? meses[i - 1] : null; };

  // mini-linha: um ponto por mês; só com 2 meses ou mais
  function spark(serie) {
    const NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg"), n = serie.length;
    s.setAttribute("class", "spark"); s.setAttribute("viewBox", "0 0 100 28"); s.setAttribute("preserveAspectRatio", "none"); s.setAttribute("aria-hidden", "true");
    const max = Math.max(0, ...serie), min = Math.min(0, ...serie), y = (v) => 26 - (v - min) / (max - min || 1) * 24, x = (i) => i / (n - 1) * 100;
    const ln = (a) => { const e = document.createElementNS(NS, "polyline"); for (const k in a) e.setAttribute(k, a[k]); e.setAttribute("vector-effect", "non-scaling-stroke"); s.append(e); };
    if (min < 0) ln({ points: `0,${y(0)} 100,${y(0)}`, stroke: "rgba(139,146,152,.4)", fill: "none" });
    ln({ points: serie.map((v, i) => `${x(i)},${y(v)}`).join(" "), stroke: "#A9B0B6", "stroke-width": 2, fill: "none" });
    const i = periodo === "tudo" ? n - 1 : meses.indexOf(periodo); // mês em foco
    if (i >= 0) ln({ points: `${x(i)},2 ${x(i)},28`, stroke: "rgba(191,216,180,.6)", "stroke-width": 1, fill: "none" });
    return s;
  }
  const serieMes = (tipo) => meses.map((m) => soma(L.filter((x) => x.tipo === tipo && mesKey(x.data) === m)));
  // média dos meses antes do mês escolhido (precisa de pelo menos 2 meses antes)
  function vsMedia(atual, serie) {
    const i = meses.indexOf(periodo); if (periodo === "tudo" || i < 2) return null;
    const ant = serie.slice(0, i), med = ant.reduce((s, v) => s + v, 0) / ant.length; if (!med) return null;
    const p = Math.round((atual - med) / med * 100); return `${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}% vs média`;
  }

  function card(box, k, v, tags, serie) {
    const c = el("div", "card"); c.append(el("div", "k", k), el("div", "v", v));
    if (serie && serie.length >= 2) c.append(spark(serie));
    const t = el("div", "tags"); for (const [txt, cls] of tags) if (txt) t.append(el("span", "tag " + (cls || ""), txt)); c.append(t); box.appendChild(c);
  }
  function variacao(atual, mesAnt) {
    if (periodo === "tudo" || mesAnt == null) return null;
    const ant = mesAnt; if (!ant) return atual ? "novo vs " + mesNome(anterior()) : null;
    const p = Math.round((atual - ant) / ant * 100); return `${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}% vs ${mesNome(anterior())}`;
  }

  function renderInicio() {
    const Lp = L.filter(noPeriodo), ant = anterior(), La = ant ? L.filter((x) => mesKey(x.data) === ant) : null;
    const gastos = soma(Lp.filter((x) => x.tipo === "Gasto")), receitas = soma(Lp.filter((x) => x.tipo === "Receita"));
    const emEstoque = P.filter((p) => p.status !== "Vendida"), vendidas = P.filter((p) => p.status === "Vendida");
    const nVend = new Set(Lp.filter((x) => x.tipo === "Receita" && x.peca).map((x) => x.peca)).size; // vendidas no período
    const parado = emEstoque.reduce((s, p) => s + custoPeca(p.id), 0);
    const box = $("cards"); box.textContent = "";
    const sG = serieMes("Gasto"), sR = serieMes("Receita"); let acc = 0; const sAcc = sG.map((g, i) => (acc += sR[i] - g));
    const velha = Math.max(-1, ...emEstoque.map(diasDe).filter((d) => d != null));
    card(box, "Investido" + (periodo === "tudo" ? "" : " no mês"), brl(gastos), [[La && variacao(gastos, soma(La.filter((x) => x.tipo === "Gasto")))], [vsMedia(gastos, sG)], [Lp.filter((x) => x.tipo === "Gasto").length + " lançamentos"]], sG);
    card(box, "Parado em estoque", brl(parado), [[emEstoque.length + (emEstoque.length === 1 ? " peça" : " peças")], ["a preço de custo"], [velha >= 0 ? `mais antiga: ${velha} dias` : null]]);
    card(box, "Vendido" + (periodo === "tudo" ? "" : " no mês"), brl(receitas), [[nVend + (nVend === 1 ? " peça vendida" : " peças vendidas")], [La && variacao(receitas, soma(La.filter((x) => x.tipo === "Receita")))], [vsMedia(receitas, sR)]], sR);
    card(box, "Resultado de caixa", brl(receitas - gastos), [["entrou − saiu"], [receitas - gastos < 0 && !vendidas.length ? "normal antes da 1ª venda" : null, "lume"]], sAcc);

    // Projeção: se o estoque vender na faixa estimada
    const pj = $("projBox"); pj.textContent = "";
    const comFaixa = emEstoque.filter((p) => p.faixa && p.faixa[0] > 0 && p.faixa[1] > 0);
    const min = comFaixa.reduce((s, p) => s + p.faixa[0], 0), max = comFaixa.reduce((s, p) => s + p.faixa[1], 0);
    const custoFaixa = comFaixa.reduce((s, p) => s + custoPeca(p.id), 0);
    pj.append(titulo("Se o estoque vender na faixa estimada", null, AJUDA.proj));
    if (!comFaixa.length) pj.append(el("p", "nota", "Nenhuma peça em estoque com faixa de preço estimada."));
    else {

    iac.append(btn(ini ? "Mudar data" : "Definir data", null, () => alternaForm("inicio", () => {
      const fm = form(iac, true), dt = campo(fm, "data", "Data prevista", "date", ini || ""), a2 = el("div", "acoes"); fm.append(a2);
      a2.append(btn("Salvar", "pri", () => { if (dt.value === (ini || "")) { fecharForm(fm); return; } gravar({ acao: "inicio", data: dt.value }, { acao: "inicio", data: ini || "" }); }), btn("Cancelar", null, () => fecharForm(fm)));
      return fm;
    })));

    // Linha do tempo das fases (com a data de início, cada mês ganha o nome do mês de verdade)
    const fb = $("fases"); fb.textContent = ""; $("fasesBox").hidden = !fases.length;
    const fh = $("fasesBox").querySelector("h2"); if (!fh.querySelector(".ajuda")) fh.append(ajuda(AJUDA.fases));
    $("fasesSub").textContent = ini ? `a partir de ${dataBR(ini)}` : "mês a mês";
    const n = Math.max(6, ...fases.map((e) => fase(e.quando)[1])); fb.style.setProperty("--n", n);
    const eixo = el("div", "eixo"); eixo.append(el("span", "lb"));
    for (let i = 1; i <= n; i++) { const s = el("span", null, "Mês " + i); if (ini) { const [y, m] = ini.split("-").map(Number), x = new Date(y, m - 2 + i, 1); s.append(el("br"), document.createTextNode(`${MESES[x.getMonth()]}/${String(x.getFullYear()).slice(2)}`)); } eixo.append(s); }
    fb.append(eixo);
    for (const e of fases) {
      const [a, b] = fase(e.quando), row = el("div", "fase"), bar = el("div", "bar", a === b ? `Mês ${a}` : `Mês ${a}–${b}`);
      bar.style.gridColumn = `${a + 1} / ${b + 2}`; row.append(el("span", "lb", e.texto), bar); fb.append(row);
    }

    const ui = $("ideias"); ui.textContent = ""; $("nI").textContent = DADOS.plano.ideias.length + "";
    for (const t of DADOS.plano.ideias) ui.append(el("li", null, t));
    dobra($("ideiasBox"), "ideias");
  }

  let pagina = "inicio";
  for (const b of document.querySelectorAll("nav.bottom button")) b.onclick = () => { pagina = b.dataset.ir; adiado = false; render(); window.scrollTo(0, 0); };

  function render() {
    for (const s of document.querySelectorAll("[data-pagina]")) s.hidden = s.dataset.pagina !== pagina;
    for (const b of document.querySelectorAll("nav.bottom button")) b.toggleAttribute("aria-current", b.dataset.ir === pagina), b.dataset.ir === pagina && b.setAttribute("aria-current", "page");
    $("pergunta").textContent = PERGUNTAS[pagina]; $("pista").textContent = PISTAS[pagina];
    const [d, h] = DADOS.atualizadoEm.split(" ");
    $("sub").innerHTML = ""; $("sub").append(document.createTextNode("Dados de "), Object.assign(el("b"), { textContent: `${d.split("-").reverse().join("/")}, ${h}` }), document.createTextNode(" · " + DADOS.fonte));
    $("periodo").hidden = pagina !== "inicio";
    pills();
    if (pagina === "inicio") renderInicio(); else if (pagina === "pecas") renderPecas(); else renderPlano();
  }
  // "?" nos blocos que já vêm prontos no HTML
  $("grafico").parentNode.querySelector("h2").append(ajuda(AJUDA.grafico));
  $("rank").parentNode.querySelector("h2").append(ajuda(AJUDA.rank));
  render();
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (pagina === "inicio") renderGrafico(); }, 200); }); // gráfico acompanha a largura (girar o celular)
  // busca a planilha de novo a cada 30 segundos (lançou na planilha, aparece aqui)
  const buscar = () => { const v = versao, chegouSeAtual = (d) => { if (v === versao) chegou(d); };
    fetch(URL_DADOS, { credentials: "omit" }).then((r) => r.json())
    .then((d) => { if (d.erro) throw new Error(d.erro); chegouSeAtual(d); })
    .catch((e) => { $("sub").textContent = "Não atualizou: " + (e && e.message || e) + " (tenta de novo em 30 s)"; }); };
  setInterval(buscar, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) buscar(); }); // aba voltou para a frente: busca na hora
})();
</script>
</body>
</html>
